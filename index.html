<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        input,
        textarea,
        button {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            box-sizing: border-box;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }

        .info {
            margin-top: 15px;
            color: #555;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>AI Resume Analyzer</h1>

    <form action="/analyze"
          method="POST"
          enctype="multipart/form-data">

        <label>
            Upload Your Resume
        </label>

        <input
            type="file"
            name="resume"
            accept=".pdf"
            required
        >

        <label>
            Job Description
        </label>

        <textarea
            name="job_description"
            placeholder="Paste the job description here..."
        ></textarea>

        <button type="submit">
            Analyze Resume
        </button>

    </form>

    <p class="info">
        Upload your PDF resume and optionally
        paste a job description to check your job match.
    </p>

</div>

</body>
</html>
